<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortext</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Vortext</h1>
        
        <!-- Video Detection Status -->
        <div id="videoStatusIndicator" class="status-indicator">
            ⏳ <span style="color: #888;">Checking video...</span>
        </div>
        
        <p class="subtitle" id="statusText">No subtitle loaded</p>

        <!-- Language Selector -->
        <div style="margin-bottom: 12px; display: flex; gap: 8px;">
            <select id="languageSelect" style="flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #0f3460; background: #16213e; color: white; font-size: 14px; cursor: pointer;">
                <option value="en">🇬🇧 English</option>
                <option value="bn">🇧🇩 Bangla</option>
                <option value="all">🌍 All Languages</option>
            </select>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search movie or show..." autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <!-- Drag & Drop Zone -->
        <div id="dropZone" class="drop-zone">
            <p style="margin: 0; color: #888; font-size: 12px;"> Drop .srt file here</p>
        </div>

        <div id="results" class="results">
            <!-- Results will appear here -->
        </div>

        <!-- Control Panel -->
        <div id="controlPanel" class="control-panel" style="display: none;">
            <div class="control-section">
                <div class="control-header">
                    <span>Subtitles</span>
                    <button id="toggleBtn" class="action-btn">ON</button>
                </div>
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span>Sync Offset</span>
                </div>
                <div class="sync-controls">
                    <button id="syncMinus" class="sync-btn">-0.1s</button>
                    <span id="syncVal" class="sync-val">0.0s</span>
                    <button id="syncPlus" class="sync-btn">+0.1s</button>
                    <button id="syncReset" class="sync-btn reset">↺</button>
                </div>
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span>Text Color</span>
                    <input type="color" id="textColor" class="color-picker">
                </div>
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span>Background</span>
                    <input type="color" id="bgColor" class="color-picker">
                </div>
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span>Font Size: <span id="fontSizeVal">20</span>px</span>
                </div>
                <input type="range" id="fontSize" min="12" max="48" class="slider">
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span>Background Opacity: <span id="opacityVal">80</span>%</span>
                </div>
                <input type="range" id="opacitySlider" min="0" max="100" value="80" class="slider">
                <p style="font-size: 10px; color: #666; margin: 5px 0 0 0;">0% = Fully Transparent</p>
            </div>

            <div class="control-section">
                <div class="control-header">
                    <span>Position</span>
                </div>
                <div class="position-controls">
                    <button id="posUp" class="pos-btn">↑</button>
                    <button id="posDown" class="pos-btn">↓</button>
                    <button id="posReset" class="pos-btn reset">↺</button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
